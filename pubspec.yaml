name: maruti_water
description: "Maruti Water RO catalogue and dealer application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.0.0
  supabase_flutter: ^2.5.0
  hive_ce: ^2.0.0
  hive_ce_flutter: ^2.0.0
  sentry_flutter: ^8.0.0
  share_plus: ^9.0.0
  connectivity_plus: ^6.0.0
  mobile_scanner: ^5.0.0
  barcode_widget: ^2.0.4
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  printing: ^5.13.0
  permission_handler: ^11.3.1
  flutter_image_compress: ^2.3.0
  pdf: ^3.10.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  freezed: ^2.4.7
  json_serializable: ^6.8.0
dependency_overrides:
  app_links: 6.3.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/fonts/
